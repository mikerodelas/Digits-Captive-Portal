<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Matcha Tokyo WiFi</title>
  <style>
    :root {
      --matcha-primary: #5f7148;
      --matcha-secondary: #758c5b;
      --matcha-dark: #243018;
      --matcha-muted: #6b7b55;
      --matcha-light: #7d8c69;
      --washi: #f7f8f3;
      --washi-mid: #eef2e3;
      --washi-dark: #e5ebd7;
      --gold-accent: #b8965a;
      --border-light: #d9e0ce;
      --text-muted: #66725b;
      --text-placeholder: #97a28b;
      --error: #d64f4f;
      --success: #4f8b52;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f7f8f3 0%, #eef2e3 50%, #e5ebd7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    .bg-pattern {
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(102, 126, 70, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      top: -250px;
      right: -200px;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 2;
    }

    .card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 30px;
      padding: 42px 34px;
      box-shadow:
        0 20px 60px rgba(64, 80, 40, 0.12),
        0 8px 20px rgba(64, 80, 40, 0.05);
      text-align: center;
    }

    .logo-section {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .logo-circle {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: #5f7148;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(95, 113, 72, 0.28);
    }

    .logo-circle span {
      color: #fff;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .brand {
      font-size: 11px;
      letter-spacing: 5px;
      font-weight: 700;
      color: #6b7b55;
      margin-bottom: 28px;
      text-transform: uppercase;
    }

    .title {
      font-size: 42px;
      line-height: 1;
      color: #243018;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .poster-tagline {
      margin-top: 10px;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #7d8c69;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.7;
      color: #66725b;
      margin-bottom: 32px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .voucher-input {
      width: 100%;
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid #d9e0ce;
      background: rgba(255, 255, 255, 0.9);
      font-size: 15px;
      color: #243018;
      outline: none;
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .voucher-input::placeholder {
      color: #97a28b;
    }

    .voucher-input:focus {
      border-color: #6f8450;
      box-shadow: 0 0 0 5px rgba(111, 132, 80, 0.12);
    }

    .btn-submit {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 18px;
      font-size: 15px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      background: linear-gradient(135deg, #5f7148 0%, #758c5b 100%);
      transition: all 0.25s ease;
      box-shadow: 0 12px 24px rgba(95, 113, 72, 0.22);
      font-family: inherit;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 35px rgba(95, 113, 72, 0.28);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 500;
      min-height: 20px;
    }

    .error-message {
      color: #d64f4f;
    }

    .success-message {
      color: #4f8b52;
    }

    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: #92a083;
      letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 34px 24px;
        border-radius: 24px;
      }

      .title {
        font-size: 32px;
      }

      .logo-circle {
        width: 72px;
        height: 72px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-pattern"></div>

  <div class="container">
    <div class="card">

      <div class="logo-section">
        <div class="logo-circle">
          <span>M</span>
        </div>
      </div>

      <div class="brand">
        Matcha Tokyo WiFi
      </div>

      <h1 class="title">The Matcha Tokyo</h1>

      <p class="poster-tagline">
        Premium Matcha Experience
      </p>

      <p class="subtitle">
        Enter your voucher code to access premium high-speed internet.
      </p>

      <form id="voucherForm">
        <div class="input-group">
          <input
            type="text"
            id="voucherCode"
            placeholder="Enter Voucher Code"
            class="voucher-input"
            required
            autocomplete="off"
            spellcheck="false"
            autofocus
          />
        </div>
        <button type="submit" class="btn-submit">Connect to WiFi</button>
      </form>

      <p id="errorMessage" class="message error-message"></p>
      <p id="successMessage" class="message success-message"></p>

      <div class="footer-note">
        Secure • Fast • Unlimited Experience
      </div>

    </div>
  </div>

  <script>
    document.getElementById('voucherForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      const voucherCode = document.getElementById('voucherCode').value.trim();
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      const btn = event.target.querySelector('button');
      
      errorMessage.textContent = '';
      successMessage.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Connecting...';

      const urlParams = new URLSearchParams(window.location.search);
      const clientIP = urlParams.get('ip');
      const clientMAC = urlParams.get('mac');
      const token = urlParams.get('token');

      if (!clientIP || !clientMAC || !token) {
        errorMessage.textContent = 'Required information is missing. Please reconnect to WiFi.';
        btn.disabled = false;
        btn.textContent = 'Connect to WiFi';
        return;
      }
      try {
        const response = await fetch(`/binauth-stage?voucher=${voucherCode}&ip=${clientIP}&mac=${clientMAC}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unknown error');
        
        successMessage.textContent = `Success! Access for ${data.duration} minutes. Redirecting...`;
        btn.textContent = 'Connected';
        
        setTimeout(() => {
          window.location.href = `http://192.168.100.1:2050/nodogsplash_auth/?tok=${token}`;
        }, 1200);
      } catch (error) {
        errorMessage.textContent = `Error: ${error.message}`;
        btn.disabled = false;
        btn.textContent = 'Connect to WiFi';
      }
    });

    (async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const clientMAC = urlParams.get('mac');
      const token = urlParams.get('token');
      if (clientMAC && token) {
        try {
          const resp = await fetch(`/binauth-check?mac=${clientMAC}`);
          if (resp.ok) {
            window.location.href = `http://192.168.100.1:2050/nodogsplash_auth/?tok=${token}`;
          }
        } catch (e) {}
      }
    })();
  </script>
</body>
</html>
